<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Gold Linear Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7CD" />
      <stop offset="25%" stop-color="#F5BD47" />
      <stop offset="50%" stop-color="#D49A24" />
      <stop offset="75%" stop-color="#9A690B" />
      <stop offset="100%" stop-color="#FDE882" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Deep Blue Radial Background -->
    <radialGradient id="bgRadial" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1E2A4A" />
      <stop offset="55%" stop-color="#090E1F" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="royalShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>

    <!-- Arc Paths for Inscribed Text -->
    <path id="arcTop" d="M 72,256 A 184,184 0 0,1 440,256" fill="none" />
    <path id="arcBottom" d="M 440,256 A 184,184 0 0,1 72,256" fill="none" />
  </defs>

  <!-- Base App Icon Rounded Canvas / Squircle (Maskable & Homescreen ready) -->
  <rect width="512" height="512" rx="112" fill="url(#bgRadial)" />
  
  <!-- Outer Luxurious Bevel Border -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#goldLinear)" stroke-width="7" opacity="0.95" />
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="#F5BD47" stroke-width="1.8" stroke-dasharray="7,5" opacity="0.65" />

  <!-- Circular Judicial Seal Container -->
  <circle cx="256" cy="256" r="218" fill="url(#shieldGrad)" stroke="url(#goldLinear)" stroke-width="8" filter="url(#royalShadow)" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-dasharray="7,5" opacity="0.85" />
  <circle cx="256" cy="256" r="150" fill="#050B1A" stroke="url(#goldLinear)" stroke-width="4.5" />

  <!-- Circular Legal Inscription -->
  <text fill="url(#goldLight)" font-size="22" font-family="'Cinzel', Georgia, serif" font-weight="900" letter-spacing="5" filter="url(#royalShadow)">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      NYAAY SAHAYOGI
    </textPath>
  </text>

  <text fill="#F1F5F9" font-size="16.5" font-family="'Cinzel', Georgia, serif" font-weight="700" letter-spacing="3.5">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      ADVOCATE &amp; BAR PORTAL
    </textPath>
  </text>

  <!-- Flanking Emblems (5-point Gold Stars) -->
  <g fill="url(#goldLight)" filter="url(#goldGlow)">
    <polygon points="66,256 70,263 78,263 72,268 74,276 66,271 58,276 60,268 54,263 62,263" />
    <polygon points="446,256 450,263 458,263 452,268 454,276 446,271 438,276 440,268 434,263 442,263" />
  </g>

  <!-- Twin Laurel Wreaths (Honor & Jurisprudence) -->
  <g stroke="url(#goldLinear)" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 120,296 C 112,266 116,226 130,196" />
    <path d="M 392,296 C 400,266 396,226 382,196" />
  </g>
  <!-- Laurel Leaves Left -->
  <g fill="url(#goldLinear)" opacity="0.9">
    <path d="M 118,290 C 108,286 110,275 123,282 Z" />
    <path d="M 113,268 C 102,264 105,253 118,260 Z" />
    <path d="M 114,244 C 104,238 109,228 120,237 Z" />
    <path d="M 121,220 C 112,212 119,203 129,213 Z" />
    <!-- Laurel Leaves Right -->
    <path d="M 394,290 C 404,286 402,275 389,282 Z" />
    <path d="M 399,268 C 410,264 407,253 394,260 Z" />
    <path d="M 398,244 C 408,238 403,228 392,237 Z" />
    <path d="M 391,220 C 400,212 393,203 383,213 Z" />
  </g>

  <!-- CENTRAL EMBLEM: Scales of Justice + Advocate Bands + Law Codex -->
  <g id="centralCrest" transform="translate(256, 252)" filter="url(#royalShadow)">
    
    <!-- Central Pillar / Sword of Justice -->
    <rect x="-5" y="-76" width="10" height="120" fill="url(#goldLinear)" rx="3" />
    
    <!-- Pillar Finial / Top Spire -->
    <circle cx="0" cy="-88" r="9.5" fill="url(#goldLight)" filter="url(#goldGlow)" />
    <polygon points="-15,-76 15,-76 10,-85 -10,-85" fill="url(#goldLinear)" />

    <!-- Ashoka Dharma Chakra (Center of Justice) with 16 spokes -->
    <circle cx="0" cy="-38" r="16" fill="#0A1128" stroke="url(#goldLight)" stroke-width="2.5" />
    <circle cx="0" cy="-38" r="3.5" fill="url(#goldLight)" />
    <path d="
      M 0,-54 L 0,-22 M -16,-38 L 16,-38 
      M -11.3,-49.3 L 11.3,-26.7 M -11.3,-26.7 L 11.3,-49.3
      M -5.5,-52.7 L 5.5,-23.3 M -5.5,-23.3 L 5.5,-52.7
      M -14.7,-43.5 L 14.7,-32.5 M -14.7,-32.5 L 14.7,-43.5
    " stroke="url(#goldLight)" stroke-width="1.3" opacity="0.95" />

    <!-- Master Balance Beam (Tilted with balanced poise) -->
    <path d="M -94 -42 Q 0 -47 94 -42" stroke="url(#goldLight)" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <circle cx="-94" cy="-42" r="5.5" fill="url(#goldLight)" />
    <circle cx="94" cy="-42" r="5.5" fill="url(#goldLight)" />

    <!-- Left Scale (Chains & Pan) -->
    <g>
      <line x1="-94" y1="-42" x2="-116" y2="10" stroke="url(#goldLinear)" stroke-width="2" />
      <line x1="-94" y1="-42" x2="-72" y2="10" stroke="url(#goldLinear)" stroke-width="2" />
      <!-- Pan Bowl -->
      <path d="M -124,10 C -124,30 -64,30 -64,10 Z" fill="url(#goldLight)" />
      <ellipse cx="-94" cy="10" rx="30" ry="4" fill="#8C590E" opacity="0.6" />
    </g>

    <!-- Right Scale (Chains & Pan) -->
    <g>
      <line x1="94" y1="-42" x2="72" y2="10" stroke="url(#goldLinear)" stroke-width="2" />
      <line x1="94" y1="-42" x2="116" y2="10" stroke="url(#goldLinear)" stroke-width="2" />
      <!-- Pan Bowl -->
      <path d="M 64,10 C 64,30 124,30 124,10 Z" fill="url(#goldLight)" />
      <ellipse cx="94" cy="10" rx="30" ry="4" fill="#8C590E" opacity="0.6" />
    </g>

    <!-- Advocate Collar & White Bands (Indian Advocate Heritage) -->
    <g transform="translate(0, -6)">
      <!-- Black Coat Wing / V-Neck Background -->
      <polygon points="0,-10 -26,-2 -22,26 0,22 22,26 26,-2" fill="#020617" stroke="url(#goldLinear)" stroke-width="1.5" />
      <!-- White Wing Collar -->
      <path d="M 0,-8 L -14,-16 L -20,-3 L -11,-1 L 0,0 L 11,-1 L 20,-3 L 14,-16 Z" fill="#FFFFFF" />
      <!-- Left Advocate Band -->
      <polygon points="-9,-1 -2,-1 -5,34 -15,34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5" />
      <!-- Right Advocate Band -->
      <polygon points="2,-1 9,-1 15,34 5,34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5" />
    </g>

    <!-- Pedestal Base: Open Constitution / Law Book -->
    <g transform="translate(0, 36)">
      <!-- Book Pages Outer -->
      <path d="M -48,0 C -24,4 -5,8 0,4 C 5,8 24,4 48,0 L 52,18 C 26,22 6,24 0,20 C -6,24 -26,22 -52,18 Z" fill="#F8FAFC" stroke="url(#goldLinear)" stroke-width="1.5" />
      <!-- Book Pages Spine & Details -->
      <line x1="0" y1="4" x2="0" y2="20" stroke="#94A3B8" stroke-width="1.5" />
      <!-- Book Cover / Foundation Plinth -->
      <rect x="-56" y="18" width="112" height="10" rx="3" fill="url(#goldLinear)" />
      <rect x="-68" y="28" width="136" height="14" rx="4" fill="url(#goldLight)" />
      <!-- Satyameva Jayate Inscription -->
      <text x="0" y="38" text-anchor="middle" font-size="8.5" font-family="'Cinzel', Georgia, serif" font-weight="900" fill="#0F172A" letter-spacing="1.2">
        SATYAMEVA JAYATE
      </text>
    </g>
  </g>
</svg>